name: Build and Release

on:
  push:
    tags:
      - 'v*'   # triggers on version tags, e.g. v1.0.0

jobs:
  build-jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build JVM JAR
        run: ./gradlew jvmJar
      - uses: actions/upload-artifact@v4
        with:
          name: jvm-jar
          path: build/libs/*-jvm-*.jar

  build-native:
    strategy:
      matrix:
        include:
          - os: windows-latest
            task: linkReleaseExecutableMingwX64
            path: build/bin/mingwX64/releaseExecutable/
            name: windows
          - os: ubuntu-latest
            task: linkReleaseExecutableLinuxX64
            path: build/bin/linuxX64/releaseExecutable/
            name: linux
          - os: macos-latest
            task: linkReleaseExecutableMacosArm64
            path: build/bin/macosArm64/releaseExecutable/
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build Native
        run: ./gradlew ${{ matrix.task }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.path }}

  release:
    needs: [build-jvm, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            jvm-jar/*.jar
            windows/*.exe
            linux/*.kexe
            macos/*.kexe